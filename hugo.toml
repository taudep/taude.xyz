baseURL = 'https://taude.xyz/'
languageCode = 'en-us'
title = 'taude.xyz'
theme = 'PaperMod'
copyright = "© Todd"
pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  env = "production"
  subtitle = "Notes on AI and things I learn along the way"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  disableSpecial1stPost = true
  sidebarBio = "Taude — notes on AI, software, and management, plus whatever else sticks."

  [[params.pinnedLinks]]
    title = "Today I Learned..."
    url = "/til/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/taudep"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/taudep"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/taudep"

  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/the.todd.p"

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 1

[[menu.main]]
  name = "My Experiments..."
  url = "/experiments/"
  weight = 2

[[menu.main]]
  name = "TIL"
  url = "/til/"
  weight = 3

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 4

[[menu.main]]
  name = "Quotes"
  url = "/quotes/"
  weight = 5

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 6

[[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 7

[outputs]
  home = ["HTML", "RSS", "JSON"]
