baseURL = 'https://taude.xyz/'
languageCode = 'en-us'
title = 'taude.xyz'
theme = 'PaperMod'
copyright = "© Todd"
pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  env = "production"
  subtitle = "Notes on AI and things I learn along the way"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  disableSpecial1stPost = true

  [params.homeInfoParams]
    Title = "Hi there \U0001F44B"
    Content = "Notes on AI and things I learn along the way."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/taudep"

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 1

[[menu.main]]
  name = "TIL"
  url = "/til/"
  weight = 2

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 3

[[menu.main]]
  name = "Quotes"
  url = "/quotes/"
  weight = 4

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 5

[[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 6

[outputs]
  home = ["HTML", "RSS", "JSON"]
